[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syllapy"
version = "0.7.2"
description = "Calculate syllable counts for English words."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Michael Holtzscher", email = "michael.holtzscher@gmail.com" },
]
keywords = ["syllables", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/mholtzscher/syllapy"

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
